# DataRegistry runtime settings
# Do not store raw personal connection metadata unless explicitly needed.

database:
  # Applies to: Both.
  # DataProvider database type (for example MYSQL).
  type: MYSQL
  profiles:
    # Connection profile for player-domain tables. Must match [A-Za-z0-9._-]{1,64}.
    players:
      connection-id: player_data_rw
    # Connection profile for service-registry tables. Must match [A-Za-z0-9._-]{1,64}.
    services:
      connection-id: player_data_rw

orm:
  # Applies to: Both. Schema mode: validate, update, create, create-drop, or none.
  schema-mode: update

privacy:
  # Applies to: Velocity lifecycle writes.
  persist-ip-address: false
  persist-virtual-host: false

features:
  # Applies to: Both. Population depends on online-status, sessions and session-visits.
  # Missing population prerequisites are restored automatically when population is enabled.
  online-status: true
  connection-info: true
  activity-summary: true
  sessions: true
  session-visits: true
  population: true
  playtime: true
  language: true
  nicknames: true
  name-history: true
  service-registry: true

playtime:
  # Applies to: Velocity. Population reuses these server-to-gamemode mapping rules.
  flush-interval-seconds: 30
  resolve-unknown-servers-as-gamemode: true
  ignored-gamemodes: []
  excluded-from-network-total-gamemodes: []
  # Ordered first-match server mapping rules. Supports '*' and '?' wildcards.
  server-gamemode-rules: []

service-registry:
  heartbeat-interval-seconds: 30
  probe-interval-seconds: 15
  probe-timeout-millis: 1500
  probe-retention-hours: -1
  probe-purge-interval-hours: 12

retention:
  # Lifecycle idempotency rows. -1 keeps them indefinitely.
  lifecycle-outbox-days: -1
  # Durable population transitions only; memberships, ordinals and aggregate state are never purged.
  # Consumers can detect a cursor that fell behind retention through PopulationTransitionBatch.
  population-transition-days: 90
  service-instance-days: -1
  closed-session-history-days: -1
  purge-batch-size: 500
  player-history-purge-interval-hours: 1
  service-instance-purge-interval-hours: 24

lifecycle:
  write-max-attempts: 3
  retry-base-delay-millis: 25

platform:
  bukkit:
    join-delay-ticks: 4
    register-service-instance: false
    service-name: auto
  velocity:
    service-name: auto

query:
  executor-threads: 2
  timeout-millis: 3000
  development-thread-checks: false

validation:
  username:
    max-length: 32
  server:
    max-length: 64
  gamemode:
    max-length: 64
  virtual-host:
    max-length: 255
  ip:
    max-length: 45
