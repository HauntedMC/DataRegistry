name: Feature Request
description: Suggest an improvement to DataRegistry
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting an improvement. DataRegistry is infrastructure, so please include concrete use cases and compatibility impact.
  - type: textarea
    id: problem
    attributes:
      label: Problem / Motivation
      description: What problem are you trying to solve?
      placeholder: Describe the concrete limitation or friction.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed Solution
      description: What behavior or API would you like to see?
      placeholder: Describe the preferred solution.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered (Optional)
      description: What other approaches did you consider?
    validations:
      required: false
  - type: dropdown
    id: scope
    attributes:
      label: Affected Area
      options:
        - Public API
        - Player identity / profiles
        - Lifecycle / presence
        - Playtime
        - Population
        - Service registry
        - Configuration / startup
        - Repository / persistence layer
        - Velocity integration
        - Bukkit/Paper integration
        - Testkit / testing
        - Build / CI
        - Documentation
        - Other / Not sure
    validations:
      required: true
  - type: checkboxes
    id: compatibility
    attributes:
      label: Compatibility Impact
      description: Select all that may apply.
      options:
        - label: Public API change
        - label: Database/schema change
        - label: Configuration change
        - label: Runtime behavior change
        - label: No compatibility impact expected
  - type: textarea
    id: example
    attributes:
      label: Example Usage (Optional)
      description: Code/config examples are useful for API proposals.
      render: java
    validations:
      required: false
  - type: textarea
    id: extra
    attributes:
      label: Additional Context (Optional)
      description: Links, diagrams, benchmarks, or related issues.
    validations:
      required: false
