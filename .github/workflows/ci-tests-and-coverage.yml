name: CI Tests and Coverage

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
  push:
    branches:
      - main

jobs:
  tests:
    name: Tests and Coverage
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    env:
      PACKAGES_USER: ${{ secrets.HAUNTEDMC_PACKAGES_USERNAME }}
      PACKAGES_TOKEN: ${{ secrets.HAUNTEDMC_PACKAGES_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate package token
        run: |
          if [ -z "$PACKAGES_USER" ]; then
            echo "Missing secret HAUNTEDMC_PACKAGES_USERNAME." >&2
            exit 1
          fi
          if [ -z "$PACKAGES_TOKEN" ]; then
            echo "Missing secret HAUNTEDMC_PACKAGES_TOKEN (requires read:packages)." >&2
            exit 1
          fi

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
          server-id: github
          server-username: PACKAGES_USER
          server-password: PACKAGES_TOKEN

      - name: Run Maven Verify
        run: mvn -U -B -ntp verify

      - name: Verify Adventure dependency alignment
        shell: bash
        run: |
          mkdir -p target/ci
          mvn -B -ntp dependency:tree \
            '-Dincludes=net.kyori:adventure-*' \
            | tee target/ci/adventure-dependency-tree.txt
          if grep -E 'net\.kyori:(adventure-api|adventure-key|adventure-nbt|adventure-resource-pack|adventure-serializer-configurate4|adventure-text-logger-slf4j|adventure-text-minimessage|adventure-text-serializer-(ansi|commons|gson|gson-legacy-impl|json|json-legacy-impl|legacy|plain)):[^:]+:4\.' target/ci/adventure-dependency-tree.txt; then
            echo "Adventure 4.x core modules remain in the resolved dependency graph." >&2
            exit 1
          fi

      - name: Upload CI Diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ci-diagnostics
          if-no-files-found: warn
          path: target/ci

      - name: Upload JaCoCo Report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: jacoco-report
          if-no-files-found: error
          path: "**/target/site/jacoco"