name: CI Lint

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  maven-policy:
    name: Shared Maven policy
    uses: HauntedMC/HauntedPlatform/.github/workflows/maven-ci.yml@v1.4.1
    with:
      maven-command: ./mvnw -U -B -ntp -DskipTests verify
    secrets:
      PACKAGES_USER: ${{ secrets.HAUNTEDMC_PACKAGES_USERNAME }}
      PACKAGES_TOKEN: ${{ secrets.HAUNTEDMC_PACKAGES_TOKEN }}

  shellcheck:
    name: ShellCheck and release-bump smoke test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    env:
      PACKAGES_USER: ${{ secrets.HAUNTEDMC_PACKAGES_USERNAME }}
      PACKAGES_TOKEN: ${{ secrets.HAUNTEDMC_PACKAGES_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: shellcheck update_version.sh dataregistry-platform-acceptance/run-platform-acceptance.sh
      - run: ./update_version.sh --dry-run patch
