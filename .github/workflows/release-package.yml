name: Release Package

on:
  push:
    tags: ["v*"]

jobs:
  release:
    name: Verify and Publish Exact Release Commit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      packages: write
    env:
      PACKAGES_USER: ${{ secrets.HAUNTEDMC_PACKAGES_USERNAME }}
      PACKAGES_TOKEN: ${{ secrets.HAUNTEDMC_PACKAGES_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up JDK 25
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
          server-id: github
          server-username: PACKAGES_USER
          server-password: PACKAGES_TOKEN

      - name: Validate release version
        id: release-version
        shell: bash
        run: |
          set -euo pipefail
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          [[ "$TAG_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "Release tag must use vX.Y.Z semantic versioning; got '${GITHUB_REF_NAME}'." >&2
            exit 1
          }
          PROJECT_VERSION="$(
            ./mvnw -q -ntp -DforceStdout help:evaluate -Dexpression=project.version \
              | awk '/^[0-9]+\.[0-9]+\.[0-9]+$/ { print; exit }'
          )"
          [[ -n "$PROJECT_VERSION" ]] || {
            echo "Unable to resolve a semantic Maven project version." >&2
            exit 1
          }
          [[ "$PROJECT_VERSION" == "$TAG_VERSION" ]] || {
            echo "Tag version '${TAG_VERSION}' does not match Maven project version '${PROJECT_VERSION}'." >&2
            exit 1
          }
          echo "value=$PROJECT_VERSION" >> "$GITHUB_OUTPUT"

      - name: Verify and publish exact release reactor
        # deployAtEnd prevents publication until the final fixture boots the just-built Paper and Velocity jars.
        run: ./mvnw -U -B -ntp -Pintegration-tests,platform-acceptance deploy
        env:
          PLATFORM_ACCEPTANCE_WORK_DIRECTORY: ${{ runner.temp }}/dataregistry-platform-acceptance
          PLATFORM_ACCEPTANCE_KEEP_WORK_DIRECTORY: "true"

      - name: Upload failing platform acceptance logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: platform-acceptance-logs
          retention-days: 7
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/dataregistry-platform-acceptance/runner.log
            ${{ runner.temp }}/dataregistry-platform-acceptance/backend.log
            ${{ runner.temp }}/dataregistry-platform-acceptance/schema-bootstrap/paper.log
            ${{ runner.temp }}/dataregistry-platform-acceptance/paper/paper.log
            ${{ runner.temp }}/dataregistry-platform-acceptance/velocity/velocity.log

      - name: Upload platform distributables
        uses: actions/upload-artifact@v7
        with:
          name: dataregistry-platform-jars
          retention-days: 7
          if-no-files-found: error
          path: |
            dataregistry-platform-paper/target/dataregistry-platform-paper-${{ steps.release-version.outputs.value }}-bundled.jar
            dataregistry-platform-velocity/target/dataregistry-platform-velocity-${{ steps.release-version.outputs.value }}-bundled.jar

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          token: ${{ github.token }}
          name: DataRegistry ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            dataregistry-platform-paper/target/dataregistry-platform-paper-${{ steps.release-version.outputs.value }}-bundled.jar
            dataregistry-platform-velocity/target/dataregistry-platform-velocity-${{ steps.release-version.outputs.value }}-bundled.jar
